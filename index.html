<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Formulário - Compartilhar</title>
  <style>
    :root{--bg:#0f1724;--card:#111827;--accent:#06b6d4;--text:#e6eef3}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;background:linear-gradient(180deg,var(--bg),#071025);color:var(--text);padding:24px;}
    .container{max-width:720px;margin:0 auto}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:20px;border-radius:12px;box-shadow:0 6px 24px rgba(2,6,23,0.6)}
    h1{font-size:20px;margin:0 0 12px}
    label{display:block;margin-top:12px;font-size:13px}
    input[type=text],textarea{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);min-height:44px}
    textarea{min-height:100px;resize:vertical}
    .row{display:flex;gap:8px;margin-top:14px}
    .btn{flex:1;padding:10px;border-radius:8px;border:0;background:var(--accent);color:#042027;font-weight:600;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text)}
    .note{font-size:13px;color:#9aa8b3;margin-top:10px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Formulário de Feedback</h1>
      <form id="feedbackForm">
        <label for="nome">Nome completo *</label>
        <input id="nome" name="nome" type="text" placeholder="Seu nome completo" required autocomplete="name" />

        <label for="instagram">Instagram</label>
        <input id="instagram" name="instagram" type="text" placeholder="@seuusuario" />

        <label for="avaliacao">O que você está achando da plataforma?</label>
        <textarea id="avaliacao" name="avaliacao" placeholder="Conte-nos o que está achando..."></textarea>

        <div class="row">
          <button type="button" class="btn" id="shareWhats">Compartilhar via WhatsApp</button>
        </div>

        <p class="note">Ao clicar em "Compartilhar via WhatsApp" será aberta uma conversa com o número (85) 9 8885-5751 já com a mensagem preenchida.</p>
      </form>
    </div>
  </div>

  <script>
    (function(){
      const PHONE = '5585988855751';
      const form = document.getElementById('feedbackForm');
      const btnWhats = document.getElementById('shareWhats');

      function coletarDados(){
        return {
          nome: document.getElementById('nome').value.trim(),
          insta: document.getElementById('instagram').value.trim(),
          av: document.getElementById('avaliacao').value.trim()
        };
      }

      function montarMensagem(d){
        return `📣 *Feedback da Plataforma*\n\n*Nome:* ${d.nome || '-'}\n*Instagram:* ${d.insta || '-'}\n*Opinião:* ${d.av || '-'}\n\nObrigado!`;
      }

      btnWhats.addEventListener('click', ()=>{
        if(!form.reportValidity()) return;
        const dados = coletarDados();
        const mensagem = montarMensagem(dados);
        const url = `https://wa.me/${PHONE}?text=` + encodeURIComponent(mensagem);
        window.open(url, '_blank');
      });
    })();
  </script>
</body>
</html>
